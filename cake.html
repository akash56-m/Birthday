<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="description" content="A dedicated birthday cake wish for Dipti."/>
  <title>Dipti's Cake Wish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --cream: #fff8ee;
      --petal: #f7c5c7;
      --rose: #ce6f7b;
      --rose-deep: #9d4d58;
      --sage: #557d71;
      --sage-soft: #d9eadf;
      --gold: #d8ad48;
      --gold-light: #f4d577;
      --ink: #3d2b1f;
      --ink-soft: #72584d;
      --shadow: rgba(82, 48, 42, 0.16);
      --script: "Dancing Script", cursive;
      --serif: "Lora", serif;
      --ui: "Poppins", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-height: 100svh;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      font-family: var(--serif);
      color: var(--ink);
      background:
        linear-gradient(155deg, rgba(217,234,223,0.72) 0 25%, transparent 25% 100%),
        linear-gradient(28deg, transparent 0 62%, rgba(247,197,199,0.72) 62% 100%),
        linear-gradient(180deg, #fff9f1 0%, #ffe8e6 54%, #fff5e5 100%);
    }

    button,
    a {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(216,173,72,0.78);
      outline-offset: 4px;
    }

    .cake-page {
      position: relative;
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding:
        calc(16px + env(safe-area-inset-top, 0px))
        max(16px, env(safe-area-inset-right, 0px))
        calc(20px + env(safe-area-inset-bottom, 0px))
        max(16px, env(safe-area-inset-left, 0px));
      isolation: isolate;
    }

    .cake-page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.2) 0 1px, transparent 1px 46px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.16) 0 1px, transparent 1px 42px);
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
    }

    .ribbon {
      position: fixed;
      z-index: -1;
      pointer-events: none;
      opacity: 0.34;
      transform-origin: center;
    }
    .ribbon.one {
      top: 9%;
      left: -18%;
      width: 52%;
      height: 24px;
      background: linear-gradient(90deg, transparent, var(--sage), transparent);
      transform: rotate(-20deg);
    }
    .ribbon.two {
      right: -20%;
      bottom: 14%;
      width: 58%;
      height: 22px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
      transform: rotate(-18deg);
    }
    .ribbon.three {
      left: 9%;
      bottom: 7%;
      width: 26%;
      height: 14px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      transform: rotate(18deg);
      opacity: 0.28;
    }

    .topbar {
      width: min(100%, 960px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ghost-btn,
    .story-link,
    .action-btn {
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      cursor: pointer;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .ghost-btn,
    .story-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 15px;
      background: rgba(255,255,255,0.66);
      color: var(--rose-deep);
      border: 1px solid rgba(206,111,123,0.18);
      box-shadow: 0 8px 24px rgba(82,48,42,0.08);
      font-family: var(--ui);
      font-size: 0.84rem;
      font-weight: 600;
    }

    .ghost-btn:hover,
    .story-link:hover,
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(82,48,42,0.14);
    }

    .cake-hero {
      width: min(100%, 960px);
      margin: 0 auto;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
    }

    .hero-copy {
      width: min(100%, 620px);
      text-align: center;
      animation: riseIn 0.72s ease both;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-family: var(--ui);
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--sage);
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: var(--script);
      font-size: 3.35rem;
      line-height: 0.95;
      color: var(--rose-deep);
      text-wrap: balance;
      letter-spacing: 0;
    }

    .hero-copy p {
      margin: 12px auto 0;
      max-width: 430px;
      color: var(--ink-soft);
      line-height: 1.65;
      font-size: 1rem;
    }

    .cake-button {
      position: relative;
      width: min(86vw, 430px);
      max-width: calc(100vw - 32px);
      max-width: calc(100svw - 32px);
      aspect-ratio: 1 / 1.03;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 24px 26px rgba(99,49,44,0.17));
      animation: cakeArrive 0.85s cubic-bezier(.2,.85,.22,1.18) both;
    }

    .cake-button::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 4%;
      height: 8%;
      border-radius: 50%;
      background: rgba(82,48,42,0.12);
      filter: blur(8px);
      transform: scaleX(1.08);
    }

    .cake-build {
      position: absolute;
      inset: 0;
      animation: gentleFloat 3.8s ease-in-out infinite;
      transform-origin: 50% 75%;
    }

    .plate {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 9%;
      height: 7%;
      border-radius: 999px;
      background:
        linear-gradient(180deg, #fff2bd, var(--gold-light) 48%, var(--gold) 100%);
      box-shadow: inset 0 -8px 12px rgba(151,104,26,0.12);
    }

    .tier {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 16px 16px 10px 10px;
      border: 1px solid rgba(157,77,88,0.15);
      overflow: hidden;
    }
    .tier::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 12%, rgba(255,255,255,0.32) 12% 20%, transparent 20% 100%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.14) 0 12px, transparent 12px 27px);
      opacity: 0.58;
    }
    .tier-bottom {
      width: 78%;
      height: 18%;
      bottom: 16%;
      background: linear-gradient(180deg, #db7f8a, var(--rose));
    }
    .tier-middle {
      width: 65%;
      height: 17%;
      bottom: 31%;
      background: linear-gradient(180deg, #ffd7d0, #ed9ca3);
    }
    .tier-top {
      width: 50%;
      height: 15%;
      bottom: 46%;
      background: linear-gradient(180deg, #fff2cf, #f6caa6);
    }

    .icing {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      height: 5.2%;
      border-radius: 999px;
      background: #fffdfa;
      box-shadow: 0 5px 0 rgba(255,255,255,0.58);
    }
    .icing.bottom { width: 82%; bottom: 32%; }
    .icing.middle { width: 69%; bottom: 47%; }
    .icing.top { width: 54%; bottom: 60%; }

    .drip {
      position: absolute;
      top: 80%;
      width: 7%;
      background: #fffdfa;
      border-radius: 0 0 999px 999px;
    }
    .drip.one { left: 18%; height: 180%; }
    .drip.two { left: 44%; height: 130%; }
    .drip.three { right: 16%; height: 165%; }

    .sprinkle {
      position: absolute;
      width: 7px;
      height: 3px;
      border-radius: 999px;
      background: var(--sage);
      transform: rotate(var(--rot));
      opacity: 0.86;
    }
    .s1 { left: 27%; bottom: 39%; --rot: 22deg; background: var(--gold); }
    .s2 { left: 61%; bottom: 41%; --rot: -16deg; background: var(--sage); }
    .s3 { left: 38%; bottom: 54%; --rot: 14deg; background: var(--rose-deep); }
    .s4 { left: 55%; bottom: 56%; --rot: -28deg; background: var(--gold); }
    .s5 { left: 47%; bottom: 67%; --rot: 21deg; background: var(--sage); }

    .candles {
      position: absolute;
      left: 50%;
      bottom: 61%;
      width: 46%;
      height: 24%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
    }

    .candle {
      position: relative;
      width: 10%;
      min-width: 12px;
      height: 58%;
      border-radius: 5px 5px 2px 2px;
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,0.85) 0 7px, transparent 7px 13px),
        linear-gradient(90deg, var(--gold), var(--gold-light));
      box-shadow: inset -3px 0 rgba(149,100,25,0.16);
    }

    .flame {
      position: absolute;
      left: 50%;
      top: -25px;
      width: 17px;
      height: 24px;
      border-radius: 55% 55% 45% 45%;
      background:
        radial-gradient(circle at 50% 68%, #fff9ad 0 22%, transparent 24%),
        linear-gradient(180deg, #ffd16b, #ff8f3a 72%, #f05e3a);
      transform: translateX(-50%);
      transform-origin: 50% 88%;
      box-shadow: 0 0 18px rgba(255,143,58,0.86), 0 0 38px rgba(255,209,107,0.42);
      animation: flameDance 0.62s ease-in-out infinite alternate;
      transition: opacity 0.42s ease, transform 0.42s ease;
    }

    .smoke {
      position: absolute;
      left: 50%;
      top: -18px;
      width: 10px;
      height: 28px;
      border: 2px solid rgba(87,111,103,0.34);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 50%;
      opacity: 0;
      transform: translateX(-50%) translateY(0) scale(0.78);
    }
    .candle:nth-child(2) .smoke { animation-delay: 0.16s; }
    .candle:nth-child(3) .smoke { animation-delay: 0.28s; }

    .wish-made .flame {
      opacity: 0;
      transform: translateX(-50%) translateY(-8px) scale(0.2);
    }
    .wish-made .smoke {
      animation: smokeRise 2.4s ease-out 2;
    }
    .wish-made .cake-build {
      animation: celebrationBounce 0.8s cubic-bezier(.2,.9,.2,1.18) both;
    }

    .wish-panel {
      width: min(100%, 620px);
      display: grid;
      justify-items: center;
      gap: 14px;
      text-align: center;
      animation: riseIn 0.72s ease 0.12s both;
    }

    .wish-status {
      min-height: 54px;
      margin: 0;
      color: var(--rose-deep);
      font-family: var(--script);
      font-size: 1.75rem;
      line-height: 1.25;
      text-wrap: balance;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      color: var(--rose-deep);
      background: rgba(255,255,255,0.74);
      border: 1px solid rgba(206,111,123,0.18);
      box-shadow: 0 9px 24px rgba(82,48,42,0.09);
      font-family: var(--ui);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .action-btn.primary {
      color: white;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      border-color: transparent;
      box-shadow: 0 12px 30px rgba(157,77,88,0.24);
    }

    .action-btn:disabled {
      cursor: default;
      opacity: 0.72;
      transform: none;
      box-shadow: 0 9px 24px rgba(82,48,42,0.09);
    }

    .action-btn[hidden] {
      display: none;
    }

    .feedback {
      min-height: 22px;
      margin: 0;
      color: var(--sage);
      font-family: var(--ui);
      font-size: 0.82rem;
      font-weight: 500;
    }

    .footer-note {
      width: min(100%, 960px);
      margin: 0 auto;
      text-align: center;
      color: var(--ink-soft);
      font-family: var(--ui);
      font-size: 0.78rem;
    }

    .burst-piece {
      position: fixed;
      z-index: 20;
      left: var(--x);
      top: var(--y);
      font-size: var(--size);
      pointer-events: none;
      animation: burst 1.2s ease-out forwards;
      transform: translate(-50%, -50%);
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cakeArrive {
      from { opacity: 0; transform: translateY(24px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0) rotate(-0.5deg); }
      50% { transform: translateY(-9px) rotate(0.5deg); }
    }

    @keyframes celebrationBounce {
      0% { transform: translateY(0) scale(1); }
      38% { transform: translateY(-16px) scale(1.035); }
      70% { transform: translateY(4px) scale(0.99); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes flameDance {
      from { transform: translateX(-50%) rotate(-4deg) scale(0.94); }
      to { transform: translateX(-50%) rotate(5deg) scale(1.08); }
    }

    @keyframes smokeRise {
      0% { opacity: 0; transform: translateX(-50%) translateY(0) scale(0.6) rotate(0); }
      18% { opacity: 0.72; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-74px) scale(1.8) rotate(22deg); }
    }

    @keyframes burst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.76) rotate(0);
      }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
          scale(1.2)
          rotate(var(--spin));
      }
    }

    @media (max-width: 620px) {
      .cake-page {
        gap: 12px;
      }
      .topbar {
        align-items: stretch;
      }
      .ghost-btn,
      .story-link {
        padding-inline: 13px;
        font-size: 0.78rem;
      }
      .cake-hero {
        gap: 12px;
        align-content: start;
        padding-top: 4px;
      }
      h1 {
        font-size: 2.65rem;
      }
      .hero-copy p {
        font-size: 0.94rem;
        line-height: 1.55;
      }
      .cake-button {
        width: min(88vw, 370px);
      }
      .wish-status {
        min-height: 48px;
        font-size: 1.48rem;
      }
      .action-btn {
        min-height: 42px;
        padding: 10px 16px;
        font-size: 0.82rem;
      }
      .footer-note {
        font-size: 0.72rem;
      }
    }

    @media (max-height: 740px) {
      .cake-page {
        grid-template-rows: auto auto auto;
      }
      .cake-hero {
        align-content: start;
        gap: 9px;
      }
      .eyebrow {
        margin-bottom: 5px;
      }
      h1 {
        font-size: 2.55rem;
      }
      .hero-copy p {
        margin-top: 7px;
      }
      .cake-button {
        width: min(76vw, 330px);
      }
      .wish-panel {
        gap: 9px;
      }
      .wish-status {
        min-height: 42px;
        font-size: 1.36rem;
      }
    }

    @media (min-width: 820px) and (min-height: 760px) {
      .cake-hero {
        grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1fr);
        column-gap: 34px;
      }
      .hero-copy {
        text-align: left;
        justify-self: end;
      }
      .hero-copy p {
        margin-left: 0;
      }
      .cake-button {
        justify-self: start;
      }
      .wish-panel {
        grid-column: 1 / -1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
      .ribbon {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="cake-page">
    <span class="ribbon one" aria-hidden="true"></span>
    <span class="ribbon two" aria-hidden="true"></span>
    <span class="ribbon three" aria-hidden="true"></span>

    <header class="topbar">
      <button class="ghost-btn" type="button" id="backBtn">Back</button>
      <a class="story-link" href="index.html">Birthday story</a>
    </header>

    <main class="cake-hero">
      <section class="hero-copy" aria-labelledby="cakeTitle">
        <p class="eyebrow">July 17, 2026</p>
        <h1 id="cakeTitle">Happy Birthday, Dipti</h1>
        <p>May this year bring softness, strength, laughter, and every little dream your heart has been saving.</p>
      </section>

      <button class="cake-button" type="button" id="cakeButton" aria-label="Blow out Dipti's birthday candles">
        <span class="cake-build" aria-hidden="true">
          <span class="plate"></span>
          <span class="tier tier-bottom"></span>
          <span class="tier tier-middle"></span>
          <span class="tier tier-top"></span>
          <span class="icing bottom"><span class="drip one"></span><span class="drip two"></span><span class="drip three"></span></span>
          <span class="icing middle"><span class="drip one"></span><span class="drip two"></span><span class="drip three"></span></span>
          <span class="icing top"><span class="drip one"></span><span class="drip two"></span><span class="drip three"></span></span>
          <span class="sprinkle s1"></span>
          <span class="sprinkle s2"></span>
          <span class="sprinkle s3"></span>
          <span class="sprinkle s4"></span>
          <span class="sprinkle s5"></span>
          <span class="candles">
            <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
            <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
            <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
          </span>
        </span>
      </button>

      <section class="wish-panel" aria-label="Birthday wish controls">
        <p class="wish-status" id="wishStatus" aria-live="polite">Close your eyes. Make one birthday wish.</p>
        <div class="action-row">
          <button class="action-btn primary" type="button" id="blowBtn">Blow candles</button>
          <button class="action-btn" type="button" id="relightBtn" hidden>Relight</button>
          <button class="action-btn" type="button" id="shareBtn">Share wish</button>
        </div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
      </section>
    </main>

    <footer class="footer-note">Made with love by Pradyum</footer>
  </div>

  <script>
    const cakeButton = document.getElementById('cakeButton');
    const blowBtn = document.getElementById('blowBtn');
    const relightBtn = document.getElementById('relightBtn');
    const shareBtn = document.getElementById('shareBtn');
    const backBtn = document.getElementById('backBtn');
    const wishStatus = document.getElementById('wishStatus');
    const feedback = document.getElementById('feedback');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let blown = false;
    let audioCtx;

    function haptic(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function playChime() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, now + index * 0.07);
          gain.gain.linearRampToValueAtTime(0.12, now + index * 0.07 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + index * 0.07);
          osc.stop(now + index * 0.07 + 0.46);
        });
      } catch (error) {
        // Sound is decorative; the visual wish still works when audio is unavailable.
      }
    }

    function showFeedback(text) {
      feedback.textContent = text;
      clearTimeout(showFeedback.timer);
      showFeedback.timer = setTimeout(() => { feedback.textContent = ''; }, 3200);
    }

    function localBurst() {
      const glyphs = ['✦', '✧', '♡', '❋', '✿'];
      const count = reducedMotion.matches ? 10 : 34;
      const centerX = window.innerWidth / 2;
      const centerY = Math.min(window.innerHeight * 0.5, cakeButton.getBoundingClientRect().top + cakeButton.offsetHeight * 0.45);

      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        const angle = (Math.PI * 2 * i) / count;
        const distance = 90 + Math.random() * 150;
        piece.className = 'burst-piece';
        piece.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        piece.style.setProperty('--x', centerX + 'px');
        piece.style.setProperty('--y', centerY + 'px');
        piece.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
        piece.style.setProperty('--dy', Math.sin(angle) * distance - 60 + 'px');
        piece.style.setProperty('--spin', (Math.random() * 420 - 210) + 'deg');
        piece.style.setProperty('--size', (14 + Math.random() * 14) + 'px');
        piece.style.color = ['#ce6f7b', '#557d71', '#d8ad48', '#9d4d58'][i % 4];
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 1300);
      }
    }

    function celebrate() {
      if (window.confetti && !reducedMotion.matches) {
        window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.58 }, scalar: 0.9 });
        window.confetti({ particleCount: 45, angle: 62, spread: 55, origin: { x: 0.14, y: 0.64 }, scalar: 0.75 });
        window.confetti({ particleCount: 45, angle: 118, spread: 55, origin: { x: 0.86, y: 0.64 }, scalar: 0.75 });
      }
      localBurst();
    }

    function blowCandles() {
      if (blown) return;
      blown = true;
      cakeButton.classList.add('wish-made');
      cakeButton.setAttribute('aria-label', 'Dipti birthday candles are blown out');
      wishStatus.textContent = 'Wish made. Happy Birthday, Dipti.';
      blowBtn.textContent = 'Wish made';
      blowBtn.disabled = true;
      relightBtn.hidden = false;
      haptic([18, 40, 18]);
      playChime();
      celebrate();
    }

    function relightCandles() {
      blown = false;
      cakeButton.classList.remove('wish-made');
      cakeButton.setAttribute('aria-label', "Blow out Dipti's birthday candles");
      wishStatus.textContent = 'Close your eyes. Make one birthday wish.';
      blowBtn.textContent = 'Blow candles';
      blowBtn.disabled = false;
      relightBtn.hidden = true;
      haptic([10]);
      showFeedback('Candles are glowing again.');
    }

    async function shareWish() {
      const shareData = {
        title: "Dipti's Birthday Cake Wish",
        text: 'A special birthday cake wish for Dipti.',
        url: window.location.href
      };
      haptic([8]);
      try {
        if (navigator.share) {
          await navigator.share(shareData);
          showFeedback('Shared with love.');
        } else {
          await navigator.clipboard.writeText(window.location.href);
          showFeedback('Cake wish link copied.');
        }
      } catch (error) {
        try {
          await navigator.clipboard.writeText(window.location.href);
          showFeedback('Cake wish link copied.');
        } catch (copyError) {
          showFeedback(window.location.href);
        }
      }
    }

    cakeButton.addEventListener('click', blowCandles);
    blowBtn.addEventListener('click', blowCandles);
    relightBtn.addEventListener('click', relightCandles);
    shareBtn.addEventListener('click', shareWish);
    backBtn.addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
